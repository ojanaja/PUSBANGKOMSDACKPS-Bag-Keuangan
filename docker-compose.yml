name: keuangan-pusbangkom

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: keuangan-db
    restart: always
    environment:
      POSTGRES_USER: keuangan_admin
      POSTGRES_PASSWORD: NasBpkDbPass2025!
      POSTGRES_DB: keuangan_pusbangkom
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: keuangan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # 2. Go Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: keuangan-backend
    environment:
      - DB_URL=postgres://keuangan_admin:NasBpkDbPass2025!@db:5432/keuangan_pusbangkom?sslmode=disable
      - JWT_SECRET=keuangan-pusbangkom-jwt-secret-2026
      - STORAGE_SERVICE_ADDR=storage-service:50051
      - COOKIE_SECURE=false
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_started
      storage-service:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "1G"

  # 5. NAS Storage Microservice
  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: keuangan-storage-service
    environment:
      - STORAGE_BASE_PATH=/app/data
    volumes:
      - kas_storage:/app/data
    ports:
      - "50051:50051"
    restart: unless-stopped

  # 4. Frontend Dev Server
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keuangan-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume to keep container's node_modules separate
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080

volumes:
  kas_storage:
  backend_storage: