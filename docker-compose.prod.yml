name: keuangan-pusbangkom-prod

services:
  db:
    build:
      context: .
      dockerfile: backend/db.Dockerfile
    container_name: keuangan-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - wal_buffers=4MB
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./scripts/auto_restore.sh:/docker-entrypoint-initdb.d/01_auto_restore.sh:ro
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    networks:
      - internal
    mem_limit: 320m
    cpus: 0.70

  backup:
    build:
      context: .
      dockerfile: backend/db.Dockerfile
    container_name: keuangan-backup
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - db
    volumes:
      - backend_storage:/app/storage
      - ./scripts/docker_auto_backup.sh:/etc/periodic/daily/docker_auto_backup:ro
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
    command: ["crond", "-f", "-d", "8"]
    networks:
      - internal
    mem_limit: 64m
    cpus: 0.20

  backend:
    image: ghcr.io/ojanaja/keuangan-pusbangkom-backend:latest
    container_name: keuangan-backend
    restart: always
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CAS_PATH: /app/storage/cas
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      GOMEMLIMIT: 96MiB
      GOGC: 100
      STORAGE_SERVICE_ADDR: 100.127.62.117:50051
    depends_on:
      - db
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
    mem_limit: 160m
    cpus: 0.60



  nginx:
    image: ghcr.io/ojanaja/keuangan-pusbangkom-nginx:latest
    container_name: keuangan-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
      - public
    mem_limit: 80m
    cpus: 0.30

  watchtower:
    image: containrrr/watchtower
    container_name: keuangan-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 300 --cleanup --include-restarting
    mem_limit: 64m
    cpus: 0.10

volumes:
  backend_storage:

networks:
  internal:
    driver: bridge
  public:
